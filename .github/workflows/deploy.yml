name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_DIR: /opt/curve-comfort
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/curve-comfort-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/curve-comfort-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runner
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_API_BASE_URL=/api
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload compose files
        env:
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          tar -cz docker-compose.prod.yml nginx \
            | ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "mkdir -p '$APP_DIR' && tar -xz -C '$APP_DIR'"

      - name: Deploy
        env:
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
            "APP_DIR='$APP_DIR' BACKEND_IMAGE='$BACKEND_IMAGE' FRONTEND_IMAGE='$FRONTEND_IMAGE' GITHUB_SHA='$GITHUB_SHA' bash -se" <<'EOF'
          set -euo pipefail
          cd "$APP_DIR"

          cat > .env <<ENV
          BACKEND_IMAGE=${BACKEND_IMAGE}:${GITHUB_SHA}
          FRONTEND_IMAGE=${FRONTEND_IMAGE}:${GITHUB_SHA}
          HTTP_PORT=${{ secrets.PROD_HTTP_PORT || '80' }}
          NODE_ENV=production
          PORT=5000
          APP_NAME=NextNodeEcom
          API_PREFIX=/api/v1
          FRONTEND_URL=${{ secrets.PROD_FRONTEND_URL }}
          CORS_ORIGIN=${{ secrets.PROD_CORS_ORIGIN }}
          CORS_CREDENTIALS=true
          TRUST_PROXY=true
          # Include the database path in this secret, e.g. /ecomerce-production.
          MONGODB_URI=${{ secrets.PROD_MONGODB_URI }}
          REDIS_URL=redis://redis:6379
          JWT_ACCESS_SECRET=${{ secrets.PROD_JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.PROD_JWT_REFRESH_SECRET }}
          JWT_ACCESS_EXPIRES_IN=15m
          JWT_REFRESH_EXPIRES_IN=7d
          COOKIE_NAME=refreshToken
          COOKIE_SECURE=true
          COOKIE_SAMESITE=lax
          COOKIE_DOMAIN=${{ secrets.PROD_COOKIE_DOMAIN }}
          COOKIE_PATH=/api/v1/auth
          SMTP_HOST=${{ secrets.PROD_SMTP_HOST }}
          SMTP_PORT=${{ secrets.PROD_SMTP_PORT || '587' }}
          SMTP_SECURE=${{ secrets.PROD_SMTP_SECURE || 'false' }}
          SMTP_USER=${{ secrets.PROD_SMTP_USER }}
          SMTP_PASS=${{ secrets.PROD_SMTP_PASS }}
          MAIL_FROM=${{ secrets.PROD_MAIL_FROM }}
          RETURN_REFRESH_TOKEN_IN_BODY=false
          ENV
          chmod 600 .env
          echo '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin
          docker compose -f docker-compose.prod.yml --env-file .env down -v --remove-orphans
          docker system prune -af
          docker compose -f docker-compose.prod.yml --env-file .env pull
          docker compose -f docker-compose.prod.yml --env-file .env up -d --wait
          docker image prune -af
          EOF
