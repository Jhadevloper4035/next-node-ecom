services:
  backend:
    build:
      context: ./backend
      target: base
    container_name: ecom_backend
    restart: unless-stopped
    command: npm run dev
    ports:
      - "5000:5000"
    env_file:
      - ./.env.development
    environment:
      NODE_ENV: development
      COOKIE_SECURE: "false"
      MONGODB_URI: mongodb://mongo:27017/ecomerce-development
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "false"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [app_network]

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: ecom_frontend
    restart: unless-stopped
    command: npm run dev -- -p 3000 -H 0.0.0.0
    ports:
      - "3000:3000"
    env_file:
      - ./.env.development
    environment:
      NODE_ENV: development
      API_BASE_URL: http://backend:5000/api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend
    networks: [app_network]

  redis:
    image: redis:7-alpine
    container_name: ecom_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [app_network]

  mongo:
    image: mongo:7
    container_name: ecom_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [app_network]

  mailpit:
    image: axllent/mailpit:latest
    container_name: ecom_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [app_network]

volumes:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
  mongo_data:
  redis_data:

networks:
  app_network:
    driver: bridge
