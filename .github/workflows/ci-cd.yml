name: CI/CD - AWS EC2

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: Manual run mode
        type: choice
        required: true
        default: deploy
        options:
          - deploy
          - validate-only
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NEXT_PUBLIC_API_URL: /api
  NEXT_PUBLIC_API_BASE_URL: /api

jobs:
  validate:
    name: Validate applications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Check backend syntax
        working-directory: backend
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-pr:
    name: Validate production images
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: false
          tags: curve-comfort-backend:pr-${{ github.event.pull_request.number }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: runner
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
          tags: curve-comfort-frontend:pr-${{ github.event.pull_request.number }}

  publish:
    name: Publish Docker images
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'deploy'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          cache-from: type=gha,scope=curve-comfort-backend
          cache-to: type=gha,mode=max,scope=curve-comfort-backend
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/curve-comfort-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/curve-comfort-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: runner
          push: true
          cache-from: type=gha,scope=curve-comfort-frontend
          cache-to: type=gha,mode=max,scope=curve-comfort-frontend
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/curve-comfort-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/curve-comfort-frontend:latest

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: publish
    environment: production
    concurrency:
      group: curve-comfort-production
      cancel-in-progress: false
    steps:
      - name: Validate deployment secrets
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if ! printf '%s' "$EC2_SSH_KEY" | grep -q -- '-----BEGIN .*PRIVATE KEY-----'; then
            echo "EC2_SSH_KEY must contain the complete private key" >&2
            exit 1
          fi

      - name: Deploy release to EC2
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/curve-comfort-backend:${{ github.sha }}
          FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/curve-comfort-frontend:${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GIT_COMMIT_SHA: ${{ github.sha }}
          HTTP_PORT: ${{ secrets.PROD_HTTP_PORT }}
          MONGODB_URI: ${{ secrets.PROD_MONGODB_URI }}
          FRONTEND_URL: ${{ secrets.PROD_FRONTEND_URL }}
          CORS_ORIGIN: ${{ secrets.PROD_CORS_ORIGIN }}
          JWT_ACCESS_SECRET: ${{ secrets.PROD_JWT_ACCESS_SECRET }}
          COOKIE_DOMAIN: ${{ secrets.PROD_COOKIE_DOMAIN }}
          SMTP_HOST: ${{ secrets.PROD_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.PROD_SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.PROD_SMTP_SECURE }}
          SMTP_USER: ${{ secrets.PROD_SMTP_USER }}
          SMTP_PASS: ${{ secrets.PROD_SMTP_PASS }}
          MAIL_FROM: ${{ secrets.PROD_MAIL_FROM }}
          CASHFREE_CLIENT_ID: ${{ secrets.PROD_CASHFREE_CLIENT_ID }}
          CASHFREE_CLIENT_SECRET: ${{ secrets.PROD_CASHFREE_CLIENT_SECRET }}
          CASHFREE_ENVIRONMENT: ${{ secrets.PROD_CASHFREE_ENVIRONMENT }}
          CASHFREE_WEBHOOK_URL: ${{ secrets.PROD_CASHFREE_WEBHOOK_URL }}
          SUPPORT_EMAIL: ${{ secrets.PROD_SUPPORT_EMAIL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          command_timeout: 20m
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,BACKEND_IMAGE,FRONTEND_IMAGE,GITHUB_REPOSITORY,GIT_COMMIT_SHA,HTTP_PORT,MONGODB_URI,FRONTEND_URL,CORS_ORIGIN,JWT_ACCESS_SECRET,COOKIE_DOMAIN,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASS,MAIL_FROM,CASHFREE_CLIENT_ID,CASHFREE_CLIENT_SECRET,CASHFREE_ENVIRONMENT,CASHFREE_WEBHOOK_URL,SUPPORT_EMAIL
          script: |
            set -eu

            mkdir -p /opt/curve-comfort
            cd /opt/curve-comfort

            if [ ! -d .git ]; then
              git clone "https://github.com/${GITHUB_REPOSITORY}.git" .
            fi

            git fetch origin "$GIT_COMMIT_SHA"
            git checkout --force --detach "$GIT_COMMIT_SHA"

            : "${MONGODB_URI:?PROD_MONGODB_URI is required}"
            : "${FRONTEND_URL:?PROD_FRONTEND_URL is required}"
            : "${CORS_ORIGIN:?PROD_CORS_ORIGIN is required}"
            : "${JWT_ACCESS_SECRET:?PROD_JWT_ACCESS_SECRET is required}"
            : "${SMTP_HOST:?PROD_SMTP_HOST is required}"
            : "${SMTP_USER:?PROD_SMTP_USER is required}"
            : "${SMTP_PASS:?PROD_SMTP_PASS is required}"
            : "${MAIL_FROM:?PROD_MAIL_FROM is required}"

            printf '%s\n' \
              "PORT=5000" \
              "APP_NAME=CurveComfort" \
              "API_PREFIX=/api/v1" \
              "NODE_ENV=production" \
              "HTTP_PORT=${HTTP_PORT:-80}" \
              "BACKEND_IMAGE=$BACKEND_IMAGE" \
              "FRONTEND_IMAGE=$FRONTEND_IMAGE" \
              "MONGODB_URI=$MONGODB_URI" \
              "REDIS_URL=redis://redis:6379" \
              "CACHE_ENABLED=true" \
              "CACHE_PREFIX=curve-comfort:v1" \
              "CACHE_DEFAULT_TTL_SECONDS=300" \
              "CACHE_PRODUCT_LIST_TTL_SECONDS=60" \
              "CACHE_PRODUCT_TTL_SECONDS=300" \
              "CACHE_CATEGORY_TTL_SECONDS=600" \
              "CACHE_OPERATION_TIMEOUT_MS=100" \
              "FRONTEND_URL=$FRONTEND_URL" \
              "CORS_ORIGIN=$CORS_ORIGIN" \
              "CORS_CREDENTIALS=true" \
              "TRUST_PROXY=true" \
              "JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET" \
              "JWT_ACCESS_EXPIRES_IN=15m" \
              "COOKIE_NAME=refreshToken" \
              "COOKIE_SECURE=true" \
              "COOKIE_SAMESITE=lax" \
              "COOKIE_DOMAIN=$COOKIE_DOMAIN" \
              "COOKIE_PATH=/api/v1/auth" \
              "SMTP_HOST=$SMTP_HOST" \
              "SMTP_PORT=${SMTP_PORT:-587}" \
              "SMTP_SECURE=${SMTP_SECURE:-false}" \
              "SMTP_USER=$SMTP_USER" \
              "SMTP_PASS=$SMTP_PASS" \
              "MAIL_FROM=$MAIL_FROM" \
              "CASHFREE_CLIENT_ID=$CASHFREE_CLIENT_ID" \
              "CASHFREE_CLIENT_SECRET=$CASHFREE_CLIENT_SECRET" \
              "CASHFREE_ENVIRONMENT=$CASHFREE_ENVIRONMENT" \
              "CASHFREE_WEBHOOK_URL=$CASHFREE_WEBHOOK_URL" \
              "SUPPORT_EMAIL=$SUPPORT_EMAIL" \
              > .env

            chmod 600 .env
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env down --remove-orphans
            docker compose -f docker-compose.prod.yml --env-file .env run --rm --no-deps backend npm run migrate:payment-attempts
            docker compose -f docker-compose.prod.yml --env-file .env run --rm --no-deps backend npm run seed:seo
            docker compose -f docker-compose.prod.yml --env-file .env run --rm --no-deps backend node -e "const nodemailer=require('nodemailer'); const t=nodemailer.createTransport({host:process.env.SMTP_HOST,port:Number(process.env.SMTP_PORT||587),secure:process.env.SMTP_SECURE==='true',auth:{user:process.env.SMTP_USER,pass:process.env.SMTP_PASS}}); t.verify().then(()=>console.log('SMTP verify ok')).catch(err=>{console.error('SMTP verify failed:', err.code||err.name, err.responseCode||'', err.message); process.exit(1);})"
            docker compose -f docker-compose.prod.yml --env-file .env up -d --no-build --remove-orphans --wait --wait-timeout 300

            BASE_URL="http://127.0.0.1:${HTTP_PORT:-80}"
            check_url() {
              url="$1"
              shift
              attempt=1

              while [ "$attempt" -le 10 ]; do
                if curl "$@" -fsS "$url" >/dev/null; then
                  echo "Health check passed: $url"
                  return 0
                fi

                echo "Health check attempt $attempt/10 failed: $url"
                attempt=$((attempt + 1))
                sleep 3
              done

              docker compose -f docker-compose.prod.yml --env-file .env logs --tail=80
              echo "Health check failed: $url" >&2
              return 1
            }

            check_url "$BASE_URL/health"
            check_url "https://127.0.0.1:${HTTPS_PORT:-443}/health" -k
            check_url "$BASE_URL/"
            check_url "$BASE_URL/api/v1/product/?limit=1"
            check_url "$BASE_URL/api/v1/seo/sitemap"
            check_url "$BASE_URL/api/v1/product/sitemap"
            check_url "$BASE_URL/api/v1/categories/sitemap"
            check_url "$BASE_URL/api/v1/blogs/sitemap"
            check_url "$BASE_URL/sitemap.xml"

            docker image prune -f
            echo "Deployed $GIT_COMMIT_SHA"
