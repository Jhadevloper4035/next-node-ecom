services:
  nginx:
    image: nginx:1.27-alpine
    container_name: curve-comfort-nginx-prod
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [app_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    container_name: curve-comfort-frontend-prod
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      API_BASE_URL: http://backend:5000/api
    depends_on:
      backend:
        condition: service_healthy
    networks: [app_network]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    container_name: curve-comfort-backend-prod
    restart: always
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      REDIS_URL: redis://redis:6379
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
    depends_on:
      redis:
        condition: service_healthy
    networks: [app_network]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: curve-comfort-redis-prod
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks: [app_network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  redis_data:

networks:
  app_network:
    driver: bridge
