upstream curve_comfort_frontend {
    server frontend:3000;
}

upstream curve_comfort_backend {
    server backend:5000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://sdk.cashfree.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://express-brevomail.vercel.app https://sdk.cashfree.com https://api.cashfree.com https://sandbox.cashfree.com; frame-src 'self' https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "clipboard-read=(), clipboard-write=(), camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

server {
    listen 80;
    server_name curve-comfort.com www.curve-comfort.com _;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://curve-comfort.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name curve-comfort.com www.curve-comfort.com;

    ssl_certificate /etc/letsencrypt/live/curve-comfort.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/curve-comfort.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10m;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location = /health {
        proxy_pass http://curve_comfort_backend/api/v1/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://curve_comfort_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://curve_comfort_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
